# ============================================================
# UserPortal — Nginx Configuration
# Frontend EC2 Instance (Amazon Linux 2 / Amazon Linux 2023)
#
# Default document root: /usr/share/nginx/html
#
# HOW TO USE THIS FILE:
#   1. SSH into your frontend EC2 instance.
#   2. Run: sudo nano /etc/nginx/conf.d/userportal.conf
#   3. Paste the server block below (lines between the dashes).
#   4. Replace INTERNAL_ALB_DNS with your actual internal ALB DNS name.
#   5. Replace EXTERNAL_ALB_DNS if you want it documented in a comment.
#   6. Run: sudo nginx -t
#   7. Run: sudo systemctl reload nginx
#
# NOTE ON OPERATING SYSTEM:
#   Amazon Linux 2 and Amazon Linux 2023 both default to:
#     Document root : /usr/share/nginx/html
#     Config dir    : /etc/nginx/conf.d/
#     Service user  : nginx
#   If you are on Ubuntu the document root is /var/www/html
#   and the config goes in /etc/nginx/sites-available/.
#   Adjust the paths below accordingly.
#
# API PATH BEHAVIOUR — READ CAREFULLY:
#   The proxy_pass below is:
#     proxy_pass http://INTERNAL_ALB_DNS;
#   (no trailing path after the hostname)
#
#   Combined with `location /api/`, Nginx will forward the FULL
#   original URI — including /api/ — to the backend.
#   Example:
#     Browser  →  GET /api/auth/login
#     Nginx    →  GET http://INTERNAL_ALB_DNS/api/auth/login
#
#   Your Flask backend must therefore register routes under /api/:
#     @app.route('/api/auth/login', methods=['POST'])
#     @app.route('/api/users',      methods=['GET','POST'])
#     etc.
#
#   Do NOT strip /api/ in this Nginx config unless your Flask app
#   handles routes without the /api/ prefix.
# ============================================================

server {
    listen       80;
    listen       [::]:80;

    # Replace EXTERNAL_ALB_DNS with your domain or EC2 public IP
    # for documentation purposes only — this does not affect routing
    # since traffic arrives via the External ALB target group.
    server_name  _;   # accept any host header; narrow this once you have a domain

    # ── Document root ────────────────────────────────────────────
    # Amazon Linux default. Change to /var/www/html for Ubuntu.
    root  /usr/share/nginx/html;
    index index.html;

    # ── Logging ──────────────────────────────────────────────────
    access_log  /var/log/nginx/userportal.access.log  main;
    error_log   /var/log/nginx/userportal.error.log   warn;

    # ── Static frontend files ─────────────────────────────────────
    # Serve HTML, CSS, JS, fonts, images directly from document root.
    # Falls back to index.html so browser navigation always works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Explicit CSS and JS asset locations (optional; the / block above
    # already handles these, but explicit blocks make intent clear).
    location ~* \.(css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires     1y;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # ── API reverse proxy ─────────────────────────────────────────
    # All /api/* requests are forwarded to the Internal ALB.
    # The full /api/ prefix is preserved in the forwarded URI.
    # See the note at the top of this file about path behaviour.
    location /api/ {

        # ┌──────────────────────────────────────────────────────┐
        # │  Replace INTERNAL_ALB_DNS with your actual           │
        # │  internal ALB DNS name, e.g.                         │
        # │  internal-my-alb-123456789.us-east-1.elb.amazonaws.com │
        # │                                                       │
        # │  Keep port 80 unless your internal ALB listener      │
        # │  uses a different port.                               │
        # └──────────────────────────────────────────────────────┘
        proxy_pass         http://INTERNAL_ALB_DNS;

        proxy_http_version 1.1;

        # Preserve original request details
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pass the original request URI without modification
        proxy_pass_request_headers on;
        proxy_pass_request_body    on;

        # Timeouts — adjust to match your Flask endpoint latency
        proxy_connect_timeout  10s;
        proxy_send_timeout     30s;
        proxy_read_timeout     30s;

        # Buffer settings — prevents Nginx from holding large request bodies
        proxy_request_buffering off;
        proxy_buffering         off;

        # Prevent Nginx from serving an HTML error page for backend failures.
        # Instead the raw upstream status code reaches the browser/api.js.
        proxy_intercept_errors  off;
    }

    # ── Security headers ──────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip compression ──────────────────────────────────────────
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_comp_level  5;
    gzip_min_length  1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Custom error pages ────────────────────────────────────────
    error_page  404  /index.html;

    # Return a clean JSON 502 for API proxying failures instead of
    # Nginx's default HTML error page, so api.js can parse the response.
    error_page  502 503 504  @api_error;
    location @api_error {
        default_type  application/json;
        return 503 '{"error":"Service temporarily unavailable. The backend may not be running."}';
    }
}
