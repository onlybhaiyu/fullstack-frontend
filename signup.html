<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — UserPortal</title>
  <meta name="description" content="Create your free UserPortal account to securely manage your personal information." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- Toast container -->
<div id="toast-container" aria-live="polite" aria-atomic="true"></div>

<main class="auth-page" role="main">
  <div class="auth-card" role="region" aria-labelledby="signup-heading">

    <!-- Logo -->
    <div class="auth-logo">
      <a href="index.html" class="brand-icon" aria-label="UserPortal Home" style="text-decoration:none">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </a>
      <a href="index.html" class="auth-logo-text" style="text-decoration:none">UserPortal</a>
    </div>

    <!-- Header -->
    <div class="auth-header">
      <h2 id="signup-heading">Create your account</h2>
      <p>Join UserPortal and manage your information securely.</p>
    </div>

    <!-- Form alert -->
    <div id="form-alert" class="alert" style="display:none" role="alert" aria-live="polite"></div>

    <!-- Google Sign-In placeholder -->
    <button id="google-signin-btn" class="btn btn-google btn-full" type="button" aria-label="Continue with Google">
      <!-- Google Logo SVG -->
      <svg class="google-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
      <span style="font-size:0.75rem;font-weight:400;opacity:0.6;margin-left:auto">(Backend required)</span>
    </button>

    <!-- Divider -->
    <div class="auth-divider">or sign up with email</div>

    <!-- Signup Form -->
    <form id="signup-form" class="auth-form" novalidate aria-label="Sign up form">

      <!-- Full Name -->
      <div class="form-group">
        <label class="form-label" for="fullName">
          Full Name <span class="required" aria-label="required">*</span>
        </label>
        <div class="input-wrapper">
          <input
            type="text"
            id="fullName"
            name="fullName"
            class="form-control"
            placeholder="Alex Johnson"
            autocomplete="name"
            required
            aria-describedby="name-error"
            aria-required="true"
          />
        </div>
        <div id="name-error" class="form-error" style="display:none" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span></span>
        </div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label" for="email">
          Email Address <span class="required" aria-label="required">*</span>
        </label>
        <div class="input-wrapper">
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="alex@example.com"
            autocomplete="email"
            required
            aria-describedby="email-error"
            aria-required="true"
          />
        </div>
        <div id="email-error" class="form-error" style="display:none" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span></span>
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label" for="password">
          Password <span class="required" aria-label="required">*</span>
        </label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Min. 8 characters"
            autocomplete="new-password"
            required
            aria-describedby="pass-error pass-strength"
            aria-required="true"
          />
          <button
            type="button"
            class="input-icon"
            data-toggle-password="password"
            aria-label="Show password"
            tabindex="0"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <!-- Strength indicator -->
        <div id="pass-strength" aria-live="polite">
          <div class="strength-bar" role="progressbar" aria-label="Password strength">
            <div class="strength-fill" id="strength-fill"></div>
          </div>
          <div class="strength-label" id="strength-label"></div>
        </div>
        <div id="pass-error" class="form-error" style="display:none" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span></span>
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label class="form-label" for="confirmPassword">
          Confirm Password <span class="required" aria-label="required">*</span>
        </label>
        <div class="input-wrapper">
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-control"
            placeholder="Repeat your password"
            autocomplete="new-password"
            required
            aria-describedby="confirm-error"
            aria-required="true"
          />
          <button
            type="button"
            class="input-icon"
            data-toggle-password="confirmPassword"
            aria-label="Show confirm password"
            tabindex="0"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <div id="confirm-error" class="form-error" style="display:none" role="alert">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
          <span></span>
        </div>
      </div>

      <!-- Terms note -->
      <p class="form-hint" style="text-align:center">
        By signing up you agree to our <a href="#" style="color:var(--primary)">Terms of Service</a> and <a href="#" style="color:var(--primary)">Privacy Policy</a>.
      </p>

      <!-- Submit -->
      <button type="submit" id="signup-btn" class="btn btn-primary btn-full btn-lg">
        Create Account
      </button>
    </form>

    <!-- Footer link -->
    <div class="auth-footer">
      Already have an account?
      <a href="login.html" id="login-link">Sign in</a>
    </div>
  </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
